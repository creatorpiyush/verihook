name: Framework or runtime request
description: Ask for an adapter or example for a framework or runtime (Fastify, Hono, NestJS, AWS Lambda, ...).
labels: ["framework"]
body:
  - type: input
    id: framework
    attributes:
      label: Framework or runtime
      placeholder: Fastify 5
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What do you do today?
      description: How you currently get the raw body and call `verifyWebhook`, and what is awkward about it.
      render: ts
  - type: textarea
    id: wanted
    attributes:
      label: What would you like?
      description: For example a plugin or middleware export (`verihook/fastify`), or a documented example.
    validations:
      required: true
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to add it yourself?
      options:
        - "Yes, I'd like to open a PR"
        - "Maybe, with some guidance"
        - "No, just requesting it"
