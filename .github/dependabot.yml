version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - /examples/dedupe-stores
      - /examples/express-server
      - /examples/fastify-server
      - /examples/hono-worker
      - /examples/nextjs-app
    schedule:
      interval: weekly
    groups:
      examples:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
